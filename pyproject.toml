[project]
name = "treeq"
version = "0.1.0"
description = "Learning family-tree relationships with a small neural network"
readme = "README.md"
authors = [
    { name = "VINODvoid"}
]
requires-python = ">=3.11"
dependencies = []

[project.scripts]
treeq = "treeq:main"

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
